<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <!-- <title>Square Calculator</title> -->
  <title>Addition Calculator</title>
</head>
<body>

  <h1>Basic Calculator</h1>
  
  <h3>Perform addition, subtraction, multiplication, or division:</h3>
  <form id="calcForm" method="GET">
    <label for="num1">Enter number 1:</label>
    <input type="number" step="any" id="num1" name="num1" required>

    <br><br>

    <label for="num2">Enter number 2:</label>
    <input type="number" step="any" id="num2" name="num2" required>

    <br><br>

    <!-- Clicking these changes the form action URL dynamically before submission -->
    <button type="submit" onclick="document.getElementById('calcForm').action='/add'">Calculate Sum (+)</button>
    <button type="submit" onclick="document.getElementById('calcForm').action='/subtract'">Calculate Difference (-)</button>
    <button type="submit" onclick="document.getElementById('calcForm').action='/multiply'">Calculate Product (*)</button>
    <button type="submit" onclick="document.getElementById('calcForm').action='/divide'">Calculate Quotient (/)</button>
</form>

</body>
</html>
