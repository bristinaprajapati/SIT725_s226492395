<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Books Catalogue</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Books Catalogue developed by s226492395</h1>
  <p>Click the button below to get all food items from the server:</p>
  <button id="getAllBooksBtn">Get all books</button>

  <ul id="booksList"></ul>

  <div id="detailsContainer">
    <h3>Book Details</h3>
    <p><strong>Title:</strong> <span id="detailTitle"></span></p>
    <p><strong>Author:</strong> <span id="detailAuthor"></span></p>
    <p><strong>Year:</strong> <span id="detailYear"></span></p>
    <p><strong>Genre:</strong> <span id="detailGenre"></span></p>
    <p><strong>Summary:</strong> <span id="detailSummary"></span></p>
    <p><strong>Price (AUD):</strong> <span id="detailPrice"></span></p>
  </div>

  <script>
    const btn = document.getElementById('getAllBooksBtn');
    const list = document.getElementById('booksList');
    const detailsContainer = document.getElementById('detailsContainer');

    btn.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/books');
        const result = await res.json();

        list.innerHTML = '';
        detailsContainer.style.display = 'none';

        if (Array.isArray(result.data)) {
          result.data.forEach(book => {
            const li = document.createElement('li');
            li.className = 'book-item';
            
            const price = typeof book.price === 'string' ? book.price : (book.price?.$numberDecimal || book.price || '');
            li.textContent = `${book.title} ${price} ${book.currency || 'AUD'}`;
            
            li.addEventListener('click', () => fetchBookById(book.id));
            list.appendChild(li);
          });
        }
      } catch (err) {
        console.error('Error fetching books:', err);
      }
    });

    async function fetchBookById(id) {
      try {
        const res = await fetch(`/api/books/${id}`);
        const result = await res.json();
        const book = result.data;

        if (book) {
          document.getElementById('detailTitle').textContent = book.title;
          document.getElementById('detailAuthor').textContent = book.author;
          document.getElementById('detailYear').textContent = book.year;
          document.getElementById('detailGenre').textContent = book.genre;
          document.getElementById('detailSummary').textContent = book.summary;
          
          const price = typeof book.price === 'string' ? book.price : (book.price?.$numberDecimal || book.price || '');
          document.getElementById('detailPrice').textContent = `${price} ${book.currency || 'AUD'}`;

          detailsContainer.style.display = 'block';
        }
      } catch (err) {
        console.error('Error fetching book details:', err);
      }
    }
  </script>
</body>
</html>
