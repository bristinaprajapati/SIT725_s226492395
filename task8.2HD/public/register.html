<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Accommodation - Register</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

   <div class="container login-wrapper">
        <div class="card login-card">
            <h1>Student Accommodation</h1>
            <h2>Create an account</h2>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
                </div>

                <div class="form-group">
                    <label for="role">Account Type:</label>
                    <select id="role" required>
                        <option value="student">Student</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="button" style="width: 100%;">Create Account</button>
            </form>

            <p id="message"></p>
            <p><a href="/login.html">Already have an account? Sign in</a></p>
        </div>
    </div>

    <script src="js/register.js"></script>

</body>
</html>
